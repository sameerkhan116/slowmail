name: Slowmail
options:
  bundleIdPrefix: com.slowmail
  deploymentTarget:
    iOS: "17.0"
packages:
  Slowmail:
    path: Packages
targets:
  Slowmail:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Slowmail
        product: SlowmailCore
      - package: Slowmail
        product: SlowmailUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slowmail.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
